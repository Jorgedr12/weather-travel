<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherTravel</title>
    <link rel="icon" type="image/png" href="assets/logotipo.jpg">
    <script src="js/config.js"></script>
    <script src="js/app.js" defer></script>
    <link href="css/output.css" rel="stylesheet">
</head>

<body class="bg-white h-screen flex overflow-hidden font-sans text-gray-800">

    <aside class="w-20 lg:w-64 h-full border-r border-gray-200 flex flex-col bg-white shrink-0 z-30 transition-all">

        <img src="assets/logotipo.jpg" alt="Logo" class="w-12 h-12 mx-auto mt-4 rounded-full shadow-sm">
        <h2 class="hidden lg:block text-center mt-2 text-lg font-bold text-[#003399] py-2">WeatherTravel</h2>

        <nav class="flex-1 px-2 lg:px-4 space-y-1 overflow-y-auto py-4 border-t border-gray-200">
            <a href="#"
                class="flex flex-col lg:flex-row items-center px-2 lg:px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-xl transition-colors group">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-heart mr-2">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" />
                </svg>
                <span class="font-medium text-[10px] lg:text-[15px]">Favoritos</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col bg-white relative min-w-0">

        <header class="h-20 bg-white border-b border-gray-200 flex items-center px-4 lg:px-8 shadow-sm z-20">
            <div class="w-full max-w-150 relative">

                <div class="relative group">
                    <input type="text" id="city-input" placeholder="Buscar ciudad o código postal"
                        class="w-full bg-[#f2f2f2] text-gray-700 h-11 px-4 pr-12 rounded-2xl border border-transparent focus:bg-white focus:border-gray-300 focus:ring-0 transition-all outline-none placeholder-gray-500 text-[15px]"
                        autocomplete="off">

                    <button id="search-btn"
                        class="absolute right-0 top-0 h-11 w-12 flex items-center justify-center text-gray-500 hover:text-[#1b4de4]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                            <path d="M21 21l-6 -6" />
                        </svg>
                    </button>
                </div>

                <div id="options-container"
                    class="hidden absolute top-full left-0 w-full bg-white border border-gray-200 rounded-b-lg shadow-xl mt-1 overflow-hidden z-50">
                    <p
                        class="px-4 py-2 text-[11px] font-bold text-gray-400 uppercase tracking-wider bg-gray-50 border-b border-gray-100">
                        Resultados</p>
                    <div id="cities-list" class="max-h-64 overflow-y-auto px-4 py-2"></div>
                </div>

            </div>
        </header>

        <section class="flex-1 bg-white p-4 lg:p-8 overflow-y-auto">
            <div class="max-w-5xl mx-auto space-y-6">

                <div>
                    <h1 class="text-2xl font-bold text-[#2b2b2b]">Pronóstico - <span id="city-name">Selecciona una
                            ciudad</span></h1>
                    <p id="p-error"
                        class="hidden mt-2 p-3 bg-red-100 text-red-700 rounded text-sm font-bold border border-red-200">
                    </p>
                </div>

                <div id="weather-info" class="hidden">
                    <h2 class="text-lg font-bold text-[#2b2b2b] mb-2">Resumen</h2>

                    <div
                        class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row">

                        <div class="flex-1 p-6 bg-white">
                            <h3 class="font-bold text-gray-500 text-sm uppercase mb-4">Tiempo Actual</h3>


                            <div class="flex items-center">
                                <div class="flex text-[#2b2b2b]">
                                    <span id="temp-val" class="text-7xl font-bold tracking-tighter">--</span>
                                    <span class="text-4xl font-bold mt-2">°</span>
                                </div>

                                <img id="weather-icon" src="" alt="Clima"
                                    class="w-32 h-32 ml-2 -mt-4 filter drop-shadow-md object-contain">
                            </div>

                            <p id="weather-desc" class="text-xl font-medium text-[#2b2b2b] mt-2 capitalize">--</p>

                            <div class="flex justify-center gap-8 mt-6 w-full">
                                <div
                                    class="flex flex-col items-center p-3 bg-gray-50 rounded-lg shadow-sm min-w-25">
                                    <span class="text-gray-500 text-sm mb-1">Humedad</span>
                                    <span id="humidity-val" class="text-xl font-bold text-gray-800">--%</span>
                                </div>

                                <div
                                    class="flex flex-col items-center p-3 bg-gray-50 rounded-lg shadow-sm min-w-25">
                                    <span class="text-gray-500 text-sm mb-1">Viento</span>
                                    <span id="wind-val" class="text-xl font-bold text-gray-800">-- km/h</span>
                                </div>
                            </div>

                        </div>

                        <div id="recommendations" class="flex-1 p-6 border-t md:border-t-0 md:border-l border-gray-300">
                            <div class="flex items-center mb-4">
                                <h3 class="font-bold text-sm uppercase">Recomendaciones de viaje</h3>
                            </div>

                            <ul id="recommendations-list" class="space-y-3">
                                <li class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex items-start">
                                    <p id="rec-text" class="text-sm text-gray-700 leading-relaxed italic">Cargando
                                        sugerencias</p>
                                </li>
                            </ul>
                        </div>

                    </div>
                </div>

                <div id="forecast-container" class="hidden"></div>

            </div>
        </section>

    </main>

    <footer class="fixed bottom-0 right-0 bg-white p-2 text-xs border-t border-l rounded-xs z-50 opacity-50">
        Desarrollado por <strong>Jorge Luis</strong>
    </footer>

</body>

</html>
