<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherTravel</title>
    <link rel="icon" type="image/png" href="assets/logotipo.jpg">
    <script src="js/config.js"></script>
    <script src="js/app.js" defer></script>
    <link href="css/output.css" rel="stylesheet">
</head>

<body class="bg-gray-50 h-screen flex overflow-hidden font-sans text-gray-800">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden transition-opacity opacity-0">
    </div>

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200 transform -translate-x-full transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0 flex flex-col">

        <div class="flex flex-col items-center border-b border-gray-100 pb-4">
            <img src="assets/logotipo.jpg" alt="Logo" class="w-12 h-12 mt-4 rounded-full shadow-sm">
            <h2 class="text-center mt-2 text-lg font-bold text-[#003399]">WeatherTravel</h2>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-6">
            <section>
                <h3 class="px-2 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                    Favoritos
                </h3>
                <ul id="lista-favoritos" class="space-y-1">
                </ul>
            </section>

            <section>
                <h3 class="px-2 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                    Historial
                </h3>
                <ul id="lista-historial" class="space-y-1">
                </ul>
            </section>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col relative min-w-0 bg-gray-50">

        <header
            class="h-16 bg-white border-b border-gray-200 flex items-center px-4 justify-between lg:justify-start shadow-sm z-20 gap-4">

            <button id="menu-btn" class="lg:hidden p-2 text-gray-600 rounded-md hover:bg-gray-100 focus:outline-none"
                type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M4 6l16 0" />
                    <path d="M4 12l16 0" />
                    <path d="M4 18l16 0" />
                </svg>
            </button>

            <article class="w-full max-w-xl relative">
                <form role="search" class="relative group" id="search-form">
                    <label for="city-input" class="sr-only">Buscar ciudad</label> <input type="text" id="city-input"
                        placeholder="Buscar ciudad"
                        class="w-full bg-gray-100 text-gray-700 h-10 px-4 pr-10 rounded-full border-none focus:bg-white  outline-none placeholder-gray-400 text-sm transition-all duration-300 focus:scale-[1.02] shadow-sm focus:shadow-md">

                    <button id="search-btn"
                        class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-gray-400 hover:text-blue-600"
                        type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                            <path d="M21 21l-6 -6" />
                        </svg>
                    </button>
                </form>

                <section id="options-container"
                    class="hidden absolute top-full left-0 w-full bg-white border border-gray-100 rounded-lg shadow-xl mt-2 overflow-hidden z-50">
                    <p
                        class="px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider bg-gray-50 border-b border-gray-100">
                        Resultados</p>
                    <ul id="cities-list" class="max-h-60 overflow-y-auto px-4 py-2"></ul>
                </section>
            </article>

            <div class="w-6 lg:hidden"></div>
        </header>

        <section class="flex-1 p-4 lg:p-8 overflow-y-auto">
            <div class="max-w-5xl mx-auto space-y-6">

                <div class="flex items-center justify-between">
                    <h1 class=" lg:text-2xl font-bold text-gray-800 truncate md:text-xs sm:text-xs">
                        Pronóstico - <span id="city-name" class="text-[#003399]">Selecciona o busca una ciudad</span>
                    </h1>
                    <button id="btn-favorite"
                        class="hidden p-2 rounded-full hover:bg-gray-100 text-gray-300 hover:text-red-500 transition-colors"
                        type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M6.979 3.074a6 6 0 0 1 4.988 1.425l.037 .033l.034 -.03a6 6 0 0 1 4.733 -1.44l.246 .036a6 6 0 0 1 3.364 10.008l-.18 .185l-.048 .041l-7.45 7.379a1 1 0 0 1 -1.313 .082l-.094 -.082l-7.493 -7.422a6 6 0 0 1 3.176 -10.215z" />
                        </svg>
                    </button>
                </div>

                <p id="p-error"
                    class="hidden p-3 bg-red-50 text-red-600 rounded-lg text-sm border border-red-100 flex items-center gap-2">
                </p>

                <section id="weather-info" class="hidden space-y-6 animate-fade-in">

                    <article
                        class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row">

                        <div class="flex-1 p-6 flex flex-col items-center md:items-start text-center md:text-left">
                            <span
                                class="px-2 py-1 bg-blue-50 text-[#003399] text-xs font-bold rounded-md uppercase tracking-wider mb-4">Actual</span>

                            <div class="flex flex-col md:flex-row items-center gap-4 md:gap-8">
                                <img id="weather-icon" src="" alt="Clima" class="w-24 h-24 filter drop-shadow-lg">
                                <div>
                                    <div class="flex items-start justify-center md:justify-start">
                                        <span id="temp-val"
                                            class="text-6xl font-extrabold text-gray-800 tracking-tighter">--</span>
                                        <span class="text-3xl font-bold text-gray-400 mt-1">°</span>
                                    </div>
                                    <p id="weather-desc" class="text-lg font-medium text-gray-500 capitalize mt-1">--
                                    </p>
                                </div>
                            </div>

                            <div class="flex gap-4 mt-6 w-full md:w-auto">
                                <div
                                    class="flex-1 md:flex-none bg-gray-50 p-3 rounded-xl flex flex-col items-center min-w-22.5">
                                    <span class="text-xs text-gray-400 font-bold uppercase">Humedad</span>
                                    <span id="humidity-val" class="text-lg font-bold text-[#003399] mt-1">--%</span>
                                </div>
                                <div
                                    class="flex-1 md:flex-none bg-gray-50 p-3 rounded-xl flex flex-col items-center min-w-22.5">
                                    <span class="text-xs text-gray-400 font-bold uppercase">Viento</span>
                                    <span id="wind-val" class="text-lg font-bold text-[#003399] mt-1">--</span>
                                </div>
                            </div>
                        </div>

                        <aside id="recommendations"
                            class="md:w-72 bg-blue-50/50 p-6 border-t md:border-t-0 md:border-l border-gray-100 flex flex-col justify-center">
                            <h3 class="font-bold text-sm text-gray-500 uppercase mb-3 flex items-center gap-2">
                                Recomendaciones
                            </h3>
                            <ul id="recommendations-list" class="space-y-2">
                                <li
                                    class="bg-white p-3 rounded-lg shadow-sm border border-blue-100 text-sm text-gray-600 italic">
                                    <span id="rec-text">Cargando.</span>
                                </li>
                            </ul>
                        </aside>
                    </article>

                    <section>
                        <h2 class="text-lg font-bold text-gray-800 mb-3 ml-1">Próximos Días</h2>
                        <div id="forecast-container"
                            class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 divide-y divide-gray-100">
                        </div>
                    </section>
                </section>

            </div>
        </section>
    </main>
    <footer class="fixed bottom-0 right-0 bg-white p-2 text-xs border-t border-l rounded-xs z-50 opacity-30">
        Desarrollado por <strong>Jorge Luis</strong>
    </footer>

</body>

</html>
